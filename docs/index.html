<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tama.js - Rootless Reactive UI Rendering</title>
    <link rel="preload" href="/static/fonts/Roboto/Roboto-VariableFont_wdth,wght.woff2" as="font" type="font/woff2"
      crossorigin="anonymous" />
    <link rel="preload" href="/static/fonts/Roboto/Roboto-Italic-VariableFont_wdth,wght.woff2" as="font"
      type="font/woff2" crossorigin="anonymous" />
    <style>
      @font-face {
        font-family: "Roboto";
        src: local("Roboto Variable Weight"), local("Roboto-Variable-Weight"),
          url("/static/fonts/Roboto/Roboto-VariableFont_wdth,wght.woff2") format("woff2");
        font-weight: 100 1000;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: "Roboto";
        src: local("Roboto Italic VariableFont Weight"), local("Roboto-Italic-Variable-Weight"),
          url("/static/fonts/Roboto/Roboto-Italic-VariableFont_wdth,wght.woff2") format("woff2");
        font-weight: 100 1000;
        font-style: italic;
        font-display: swap;
      }

    </style>

  </head>
